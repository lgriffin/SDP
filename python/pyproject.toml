[project]
name = "sdp-workspace"
version = "0.1.0"
description = "SDP uv workspace root"
requires-python = ">=3.12"
dependencies = ["sdp-kernel", "sdp-contracts", "sdp-adapters", "sdp-cli", "sdp-api"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.115",
  "mypy>=1.13",
  "ruff>=0.8",
  "import-linter>=2.1",
  "pytest-archon>=0.0.6",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "types-pyyaml",
  "datamodel-code-generator==0.87.0",
  "httpx>=0.27",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sdp-kernel = { workspace = true }
sdp-contracts = { workspace = true }
sdp-adapters = { workspace = true }
sdp-cli = { workspace = true }
sdp-api = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
junit_family = "xunit1"
markers = [
  "req(id): the requirement id(s) this test verifies (read by spec-harness trace)",
  "tier(name): the test tier T0..T11 (§11.1)",
  "gate(id): the predeclared gate(s) this test evaluates (read by spec-harness trace)",
  "scientific: tier T8 scientific validation (nightly)",
  "integration: tier T5, needs real infrastructure",
  "live: tier T11, touches live archives (weekly)",
  "gpu: needs a CUDA device (DGX runner)",
  "slow: long-running",
]
filterwarnings = [
  "error::DeprecationWarning:sdp.*",
  # starlette 1.x nudges TestClient users towards httpx2; httpx still works and is what we pin
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/*/src", "tests"]
extend-exclude = ["packages/sdp-contracts/src/sdp/contracts/v1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "TID", "PT", "C4", "PIE", "RET"]
# E501: the formatter owns line length; PT018: compound asserts read better in scientific checks
ignore = ["RUF001", "RUF002", "RUF003", "N818", "PT011", "PT018", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Fakes over mocks (ADR-006, TST-005): use the fakes in sdp.testing."
"pickle".msg = "No pickle anywhere (§15)."

[tool.ruff.lint.isort]
known-first-party = ["sdp", "sdp_relativity", "sdp_stellar"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/sdp-kernel/src", "packages/sdp-contracts/src", "packages/sdp-adapters/src", "packages/sdp-cli/src", "packages/sdp-api/src"]
plugins = []
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["astropy.*", "pyarrow.*", "hypothesis.*", "pytest_archon.*", "jsonschema.*", "referencing.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["sdp"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Kernel layers: application > ports > science > domain (§4)"
type = "layers"
layers = [
  "sdp.kernel.application",
  "sdp.kernel.ports",
  "sdp.kernel.science",
  "sdp.kernel.domain",
]

[[tool.importlinter.contracts]]
name = "Kernel never imports testing fakes or infrastructure (NFR-006)"
type = "forbidden"
source_modules = ["sdp.kernel"]
forbidden_modules = ["sdp.testing", "sdp.contracts", "pydantic", "psycopg", "duckdb", "httpx", "sklearn", "strawberry", "typer"]

[[tool.importlinter.contracts]]
name = "Kernel never imports adapters (§4)"
type = "forbidden"
source_modules = ["sdp.kernel", "sdp.testing"]
forbidden_modules = ["sdp.adapters"]

[[tool.importlinter.contracts]]
name = "Adapters do not import each other; only bootstrap composes them (§4)"
type = "independence"
modules = [
  "sdp.adapters.postgres",
  "sdp.adapters.storage",
  "sdp.adapters.ledger",
  "sdp.adapters.compute",
  "sdp.adapters.telemetry",
]
