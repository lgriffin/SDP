[project]
name = "sdp-contracts"
version = "1.0.0"
description = "Pydantic models generated from contracts/schemas (the single source of truth), plus validation and domain mappers"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
  "pydantic>=2.9",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "sdp-kernel",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]
