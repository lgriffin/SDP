[project]
name = "sdp-api"
version = "0.1.0"
description = "ASGI app: GraphQL queries over the evidence, a few command endpoints, and health (ADR-016)"
requires-python = ">=3.12"
license = { text = "See repository LICENSE" }
dependencies = ["sdp-kernel", "sdp-adapters", "strawberry-graphql>=0.240", "starlette>=0.38", "uvicorn>=0.30"]

[project.optional-dependencies]
# The science modules: protocols, Investigate field tests and candidate rankers, found by entry point.
# Without them the kernel runs, and a plan naming one of their plugins is refused before anything runs.
science = ["sdp-investigate", "sdp-relativity", "sdp-stellar"]

[project.scripts]
sdp-api = "sdp.api.serve:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]
