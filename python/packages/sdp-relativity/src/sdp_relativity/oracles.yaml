# Oracle registry for UC-02 (§9). Values marked to_transcribe are "as commonly reported" placeholders;
# values marked transcribed were read from the cited page and still need a recorded second pass.
# They become usable only when transcribed from the cited page with a locator and checked by a second
# reader; until then any gate that names them reports oracle_unverified and the verdict is INCONCLUSIVE.
# Do not edit a value here without its locator and a verification record.
oracles:
  - oracle_id: gr-limb
    kind: analytic
    description: General-relativistic limb deflection 4GM/(c^2 R), computed from recorded constants
    status: analytic
  - oracle_id: half-limb
    kind: analytic
    description: Half deflection 2GM/(c^2 R), computed from recorded constants
    status: analytic
  - oracle_id: sobral-4in-1920
    kind: published_estimate
    instrument: sobral-4in
    value_arcsec: 1.98
    uncertainty_arcsec: 0.12
    convention: probable_error
    source: Dyson, Eddington and Davidson 1920, Phil. Trans. A 220, 291
    doi: 10.1098/rsta.1920.0009
    locator: "p. 306 (1.98 arcsec at the limb); p. 331 (probable error about 0.12 arcsec)"
    transcriber: claude
    status: transcribed
    verifications: []
  - oracle_id: principe-1920
    kind: published_estimate
    instrument: principe-astro
    value_arcsec: 1.61
    uncertainty_arcsec: 0.30
    convention: probable_error
    source: Dyson, Eddington and Davidson 1920, Phil. Trans. A 220, 291
    doi: 10.1098/rsta.1920.0009
    locator: "p. 328, para. 37 (1.61 +- 0.30 arcsec); p. 331"
    transcriber: claude
    status: transcribed
    verifications: []
  - oracle_id: sobral-astro-1920
    kind: published_estimate
    instrument: sobral-astro
    value_arcsec: 0.93
    uncertainty_arcsec: null
    convention: null
    source: Dyson, Eddington and Davidson 1920, Phil. Trans. A 220, 291
    doi: 10.1098/rsta.1920.0009
    locator: "p. 312 (0.93 arcsec at the limb); p. 331"
    transcriber: claude
    status: transcribed
    verifications: []
  - oracle_id: sobral-4in-1979
    kind: published_estimate
    instrument: sobral-4in
    value_arcsec: 1.90
    uncertainty_arcsec: 0.11
    convention: null
    source: Harvey 1979, The Observatory 99, 195
    locator: null
    status: to_transcribe
    verifications: []
  - oracle_id: sobral-astro-1979
    kind: published_estimate
    instrument: sobral-astro
    value_arcsec: 1.55
    uncertainty_arcsec: 0.34
    convention: null
    source: Harvey 1979, The Observatory 99, 195
    locator: null
    status: to_transcribe
    verifications: []
  - oracle_id: gtp-2020
    kind: reanalysis
    source: Gilmore and Tausch-Pebody 2020, Notes Rec. 76, 155
    doi: 10.1098/rsnr.2020.0040
    locator: null
    status: to_transcribe
    verifications: []
    # Conclusions as commonly summarised, one per instrument, each to be replaced by the paper's own words.
    conclusions:
      sobral-4in: supports the general-relativistic value and excludes the half value
      principe-astro: consistent with the general-relativistic value, with large uncertainty
      sobral-astro: unreliable as reduced in 1920 because of the plate-scale problem; not evidence for the half value
    preferred:
      sobral-4in: UC02-H2
      principe-astro: UC02-H2
      sobral-astro: null
