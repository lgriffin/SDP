[project]
name = "sdp-adapters"
version = "0.1.0"
description = "Driven adapters for the SDP kernel: NAS artifact store, PostgreSQL metadata, Git-signed ledger, CPU executor, archives and dialects, DuckDB analytics, image detection and WCS refinement, system probes, telemetry"
requires-python = ">=3.12"
license = { text = "See repository LICENSE" }
dependencies = [
  "sdp-kernel",
  "psycopg[binary]>=3.2",
  "cryptography>=43",
  "duckdb>=2.0",
  "pyyaml>=6",
  "photutils>=2.0",
  "tweakwcs>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]
