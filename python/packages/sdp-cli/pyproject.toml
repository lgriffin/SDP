[project]
name = "sdp-cli"
version = "0.1.0"
description = "The sdp command line: the composition root for signed, command-side workflows (ADR-016)"
requires-python = ">=3.12"
license = { text = "See repository LICENSE" }
dependencies = ["sdp-kernel", "sdp-adapters", "typer>=0.12"]

[project.scripts]
sdp = "sdp.cli.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]
