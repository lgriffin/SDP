[project]
name = "sdp-kernel"
version = "0.1.0"
description = "SDP scientific kernel: domain, application use cases, ports, science contracts and the testing fakes"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
  "numpy>=2.0",
  "astropy>=6.1",
  "pyarrow>=17",
  "scipy>=1.13",
]

[project.optional-dependencies]
testing = ["pytest>=8.3", "hypothesis>=6.115"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]
