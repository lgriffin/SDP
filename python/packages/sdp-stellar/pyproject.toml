[project]
name = "sdp-stellar"
version = "0.1.0"
description = "UC-01: open-cluster recovery and candidate search in Gaia DR3 (architecture spec §10)"
requires-python = ">=3.12"
license = { text = "See repository LICENSE" }
dependencies = ["sdp-kernel", "numpy>=1.26", "scipy>=1.13", "astropy>=6.1", "pyarrow>=16"]

[project.entry-points."sdp.protocols"]
uc01-stellar-clusters = "sdp_stellar.protocol:StellarClusterProtocol"

[project.entry-points."sdp.candidate_rankers"]
stellar = "sdp_stellar.ranking:StellarCandidateRanker"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp_stellar"]
