[project]
name = "sdp-investigate"
version = "0.1.0"
description = "Investigate (UC-03): the registered field tests, each a TaskKind with a CPU reference and a null model (Investigate §5)"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = ["sdp-kernel", "sdp-stellar", "numpy>=2.0", "scipy>=1.13", "astropy>=6.1"]

[project.entry-points."sdp.investigation_tests"]
core = "sdp_investigate:registered_tests"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp_investigate"]
