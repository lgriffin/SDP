# Pillars of Creation: Gaia's stars against JWST and Hubble images of the Eagle Nebula (M16).
#
# For every Gaia star in the field, this profile moves the star along its Gaia proper motion to the date
# of each image, and asks whether the image shows a source there:
#   image-counterpart -> missing, or displaced by more than the combined uncertainties allow
# The images are JWST's 2022 NIRCam and MIRI mosaics (programme 2739) and Hubble's mosaics from 1995 on
# (WFPC2, NICMOS, ACS, WFC3). Whole files run to about 20 GB for JWST alone, so the plan cuts a
# 180-arcsec square out of each one, keeps one mosaic per instrument and filter, and stops at the
# budget below: 2,000,000,000 bytes, of which 10% is held back.
#
# The profile names no field. Give the region on the command line once you have checked it; the
# proposed one, and why, is in docs/pillars.md. Nothing is downloaded until you approve the plan.
# Read profiles/README.md for what each setting means. Changing anything here makes a new profile:
# raise `version` (the run records this file's hash).
schema_version: "1.0.0"
profile_id: pillars-of-creation
version: 1.0.0
description: >-
  Gaia against JWST and Hubble in the Pillars of Creation. Checks that each Gaia star appears on each
  mosaic where its motion puts it, within a 2 GB download. Exploratory: a flag is a lead, never a claim.

identify:
  route: catalogue
  source_id: gaia
  release_label: gaia:DR3
  columns: [source_id, ref_epoch, ra, ra_error, dec, dec_error, parallax, parallax_error, pmra, pmra_error,
            pmdec, pmdec_error, ra_dec_corr, ra_parallax_corr, ra_pmra_corr, ra_pmdec_corr, dec_parallax_corr,
            dec_pmra_corr, dec_pmdec_corr, parallax_pmra_corr, parallax_pmdec_corr, pmra_pmdec_corr,
            phot_g_mean_mag, bp_rp, ruwe, astrometric_params_solved, duplicated_source]
  quality_cuts:
    - {column: ruwe, op: "<", value: 1.4}               # well-behaved single-star astrometry (Lindegren et al. 2021)
    - {column: phot_g_mean_mag, op: ">", value: 17.0}   # brighter stars saturate NIRCam's cores, so no clean centroid
  match_radius_arcsec: 1.0
  row_cap: 2000
  resolve: false                       # SIMBAD would cost a request per star; the field's context comes later
  resolver_radius_arcsec: 2.0

archives:
  - source_id: mast
    role: observations
    release_label: mast:caom
    columns: []
    match_radius_arcsec: 120.0         # mosaics whose centre lies within 2 arcmin of the field edge; the probe drops those that miss it
    missions: [JWST, HST]              # JWST first: when the budget runs short, Hubble's filters give way
    product_types: [image]
    min_calibration_level: 3           # combined mosaics only (level 3), not every single exposure (level 2)
    cutout_arcsec: 180.0               # a 3-arcmin square around the field centre: the three pillars
    select:
      one_per: [mission, instrument, band]   # one mosaic per instrument and filter
      combined_only: true                    # MAST lists each exposure's mosaic beside the visit's; keep the visit's
      measure_reads: true                    # cost each cutout at the full-width rows it reads, not the square it keeps
      min_coverage: 0.5                      # leave out a mosaic that holds less than half of the square
      max_products: 24

budget:
  max_bytes: 2000000000                # 2 GB (decimal), the most the run may download
  reserve_fraction: 0.10               # products fill 1.8 GB; the rest covers catalogue queries and size surprises

tests:
  - name: image-counterpart
    version: 1.0.0
    thresholds:
      source_id: gaia
      fwhm_px: 2.0                     # NIRCam short wavelength and WFC3/UVIS; coarser for MIRI and WFC3/IR (docs/pillars.md)
      nsigma: 5.0                      # a detection is 5 times the background noise
      search_radius_arcsec: 0.5        # counterparts within half an arcsecond of the predicted position
      exclude_percentile: 25.0         # nebular emission fills much of each background box
      align_wcs: true                  # first shift each image onto Gaia: archived astrometry can be off by arcseconds
      anchor_sigma_arcsec: 0.01        # Gaia position at the image date
      min_sigma_arcsec: 0.01           # the floor of a mosaic aligned to Gaia (about 10 milliarcseconds)
    needs_products: [image]            # the test reads images, so the plan must fetch some

ranking:
  policy_id: significance
  version: 1.0.0
  alpha: 0.01
  threshold: 1.0                       # one test, so a star is a candidate only when it is significant

null_fields:
  trials: 5
