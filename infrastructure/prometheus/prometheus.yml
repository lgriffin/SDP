# Scrape configuration shared by the Quadlet units and the developer compose stack (NFR-010).
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: sdp-textfile
    static_configs:
      - targets: ["sdp-node-exporter:9100"]
  - job_name: dcgm
    static_configs:
      - targets: ["sdp-dcgm-exporter:9400"]
  - job_name: postgres
    static_configs:
      - targets: ["sdp-postgres-exporter:9187"]
