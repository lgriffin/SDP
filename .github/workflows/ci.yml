# CI stages of §11.7. The `ci-ok` job is the single required status check for
# branch protection and auto-merge; it succeeds only when every stage it needs succeeds.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-contracts:
    name: static · contracts and requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Contract fixtures and draft predeclarations
        run: uv run --no-project --with jsonschema --with referencing python contracts/tools/check_fixtures.py
      - name: .ears structure
        run: uv run --no-project --with pyyaml python tools/check_ears.py

  python-static:
    name: static · ruff, mypy, import-linter (T0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/sdp-kernel/src packages/sdp-contracts/src tests
      - run: uv run lint-imports

  python-fast:
    name: fast · unit, property, contract, use-case (T0-T4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - name: pytest
        run: uv run pytest -q -m "not integration and not live and not gpu" --junitxml=../reports/junit-python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-python
          path: reports/junit-python.xml

  contracts-codegen:
    name: static · generated contract code is fresh (CTR-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd python && uv sync --python 3.12 --frozen
      - run: contracts/tools/generate.sh --check

  ts-fast:
    name: fast · TypeScript typecheck and tests (T6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ts
          path: reports/junit-ts-*.xml

  ci-ok:
    name: ci-ok
    if: always()
    needs: [static-contracts, python-static, python-fast, contracts-codegen, ts-fast]
    runs-on: ubuntu-latest
    steps:
      - name: Every stage passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
