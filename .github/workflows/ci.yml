# CI stages of §11.7. The `ci-ok` job is the single required status check for
# branch protection and auto-merge; it succeeds only when every stage it needs succeeds.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-contracts:
    name: static · contracts and requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Contract fixtures and draft predeclarations
        run: uv run --no-project --with jsonschema --with referencing python contracts/tools/check_fixtures.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: .ears compile (spec-harness ears)
        run: pnpm harness ears --out reports/requirements
      - name: ESLint and dependency-cruiser (T0, TST-005)
        run: pnpm lint

  python-static:
    name: static · ruff, mypy, import-linter (T0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/sdp-kernel/src packages/sdp-contracts/src packages/sdp-adapters/src packages/sdp-cli/src packages/sdp-api/src packages/sdp-relativity/src packages/sdp-investigate/src packages/sdp-stellar/src tests
      - run: uv run lint-imports

  python-fast:
    name: fast · unit, property, contract, use-case, synthetic science (T0-T4, T8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - name: pytest
        run: uv run pytest -q -m "not integration and not live and not gpu" --junitxml=../reports/junit-python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-python
          path: reports/junit-python.xml

  python-integration:
    name: integration · real adapters on PostgreSQL (T5, TST-003)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sdp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: python
    env:
      SDP_TEST_DATABASE_URL: postgresql://postgres:sdp@127.0.0.1:5432/postgres
      SDP_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - name: pytest -m integration
        run: uv run pytest -q -m integration --junitxml=../reports/junit-python-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-python-integration
          path: reports/junit-python-integration.xml

  contracts-codegen:
    name: static · generated contract code is fresh (CTR-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cd python && uv sync --python 3.12 --frozen
      - run: pnpm install --frozen-lockfile
      - run: contracts/tools/generate.sh --check

  ts-fast:
    name: fast · TypeScript typecheck and tests (T6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ts
          path: reports/junit-ts-*.xml

  e2e:
    name: e2e · evidence UI in Chromium (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sdp/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @sdp/e2e e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: typescript/packages/e2e/playwright-report

  cross-language:
    name: fast · kernel manifests through the harness (T6, TST-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cd python && uv sync --python 3.12 --frozen
      - run: pnpm install --frozen-lockfile
      - name: Run the synthetic protocol on the kernel
        run: cd python && uv run python -m sdp.testing.emit ../reports/emitted
      - name: Every manifest conforms (CTR-004)
        run: pnpm harness conform reports/emitted/experiments contracts/fixtures/valid/evidence-manifest/synthetic-verified-1.1.json
      - name: The harness re-derives every verdict (TST-007)
        run: pnpm harness rederive reports/emitted/experiments --out reports/rederive.json
      - name: UC-02 with the independent TypeScript fitter feeding the kernel (REL-007)
        run: |
          mkdir -p reports/uc02
          (cd python && uv run python -m sdp_relativity.synthetic ../reports/uc02/bundle.json)
          node typescript/packages/relativity-fit/src/cli.ts reports/uc02/bundle.json --out reports/uc02/independent-fit.json
          (cd python && uv run python -m sdp.testing.emit ../reports/uc02 --protocol uc02-einstein-1919 --input observations=../reports/uc02/bundle.json --input independent_fit=../reports/uc02/independent-fit.json --param bootstrap_resamples=200)
          # Synthetic data cannot verify the published oracles: INCONCLUSIVE, with the two fitters agreeing.
          jq -e '.verdict.status == "INCONCLUSIVE" and (.checks[] | select(.gate_id == "REL-G-08") | .outcome == "pass")' reports/uc02/experiments/*/*/manifest.json
          pnpm harness conform reports/uc02/experiments
          pnpm harness rederive reports/uc02/experiments

  guard:
    name: static · behaviour changes carry an .ears change (TST-002)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness guard --base origin/${{ github.base_ref }} --head HEAD

  viewer:
    name: fast · Imviz plugin in its own environment (INV-012)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer/sdp-imviz
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q --junitxml=../../reports/junit-viewer.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-viewer
          path: reports/junit-viewer.xml

  trace:
    name: fast · requirement coverage gate (TST-001)
    needs: [python-fast, python-integration, ts-fast, viewer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports/junit
          merge-multiple: true
      - name: spec-harness trace
        run: pnpm harness trace --junit reports/junit --tiers T0,T1,T2,T3,T4,T5,T6,T8,harness,lint --out reports/traceability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability
          path: reports/traceability

  ci-ok:
    name: ci-ok
    if: always()
    needs: [static-contracts, python-static, python-fast, python-integration, contracts-codegen, ts-fast, e2e, cross-language, guard, trace, viewer]
    runs-on: ubuntu-latest
    steps:
      - name: Every stage passed
        run: |
          # guard runs on pull requests only; elsewhere it is skipped, which is not a failure
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or (.key == "guard" and .value.result == "skipped"))'
