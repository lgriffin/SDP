# T10 mutation testing (§11.5, TST-004): weekly scores per package and the high-water ratchet.
name: Mutation

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      update:
        description: Push raised high-water marks to a review branch
        type: boolean
        default: false
  # The release workflow scores the tagged commit (T10 runs weekly and at release).
  workflow_call:
    inputs:
      update:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  targets:
    name: mutmut · targets
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.list.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      # the matrix comes from tools/mutation.py, so every shard it defines is scheduled
      - id: list
        run: echo "python=$(python3 python/tools/mutation.py --list)" >> "$GITHUB_OUTPUT"

  python:
    name: mutmut · ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    # the relativity analysis shard alone runs past three hours (tools/mutation.py, RELATIVITY_SHARDS)
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.python) }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - run: uv run python tools/mutation.py --out ../reports/mutation/python-${{ matrix.target }}.json ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-python-${{ matrix.target }}
          path: reports/mutation/

  typescript:
    name: Stryker · ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: [spec-harness, relativity-fit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx stryker run
        working-directory: typescript/packages/${{ matrix.package }}
      - run: node typescript/tools/stryker-scores.mjs --out reports/mutation/typescript-${{ matrix.package }}.json ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-typescript-${{ matrix.package }}
          path: reports/mutation/

  ratchet:
    name: ratchet · high-water marks
    needs: [python, typescript]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          path: reports/mutation
          merge-multiple: true
      - name: Merge the per-package scores
        run: |
          node -e '
            const fs = require("fs");
            const dir = "reports/mutation";
            const all = {};
            for (const f of fs.readdirSync(dir).filter((f) => /^(python|typescript)-.*\.json$/.test(f) && !f.endsWith(".details.json")))
              Object.assign(all, JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")));
            fs.writeFileSync(`${dir}/scores.json`, JSON.stringify(all, null, 2) + "\n");
            console.log(all);
          '
      - name: Refuse to record marks from a partial run
        if: inputs.update && (needs.python.result != 'success' || needs.typescript.result != 'success')
        run: |
          echo "::error::a mutation job did not succeed (python: ${{ needs.python.result }}, typescript: ${{ needs.typescript.result }}); high-water marks are only recorded from a complete run"
          exit 1
      - name: spec-harness ratchet
        run: pnpm harness ratchet --scores reports/mutation/scores.json --high-water mutation/high-water.json ${{ inputs.update && '--update' || '' }}
      - name: Push raised marks for review (manual runs with update)
        if: inputs.update
        run: |
          set -euo pipefail
          if git diff --quiet mutation/high-water.json; then echo "no change"; exit 0; fi
          branch="mutation/high-water-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add mutation/high-water.json
          git commit -m "Mutation high-water marks from run ${GITHUB_RUN_ID}"
          git push origin "$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-scores
          path: reports/mutation/scores.json
