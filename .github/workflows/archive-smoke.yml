# T11: weekly live smoke against every archive source (DSI-008, ADR-015). The only job that calls a live archive.
name: Archive live smoke

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  # write only so a manual run can push its recordings to an archive-cassettes/ branch for review
  contents: write

jobs:
  smoke:
    name: live · archive schema drift and cassette recording (T11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - name: Record and compare against the committed cassettes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../reports
          uv run sdp archive smoke --baseline tests/cassettes --record ../reports/cassettes | tee ../reports/archive-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cassettes
          path: |
            reports/cassettes
            reports/archive-smoke.json
      - name: Push the recordings to a branch (manual runs only)
        # The recordings are reviewed and merged like code; the scheduled run only reports drift.
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [ ! -d reports/cassettes ]; then echo "nothing recorded"; exit 0; fi
          branch="archive-cassettes/run-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          cp -R reports/cassettes/. python/tests/cassettes/
          git add python/tests/cassettes
          git commit -m "Archive live smoke recordings from run ${GITHUB_RUN_ID}"
          git push origin "$branch"
