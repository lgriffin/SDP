# T11: weekly live smoke against every archive source (DSI-008, ADR-015). The only job that calls a live archive.
name: Archive live smoke

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  # write only so a manual run can push its recordings to an archive-cassettes/ branch for review
  contents: write

jobs:
  smoke:
    name: live · archive schema drift and cassette recording (T11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      # The same script anyone can run on their own machine (python/tools/record_live_data.py): the live
      # smoke, the CDS X-Match agreement check (DSI-009), then the replay tests on what was recorded.
      # Manual runs commit the recordings to an archive-cassettes/run-<id> branch for review; the
      # scheduled run only reports drift.
      - name: Record, check and (manual runs only) push the recordings
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            uv run python tools/record_live_data.py --label "run-${GITHUB_RUN_ID}"
          else
            uv run python tools/record_live_data.py --no-push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cassettes
          path: |
            reports/cassettes
            reports/archive-smoke.json
