"""A source plans are matched against, as registered (INV-019)."""
type ArchiveSource {
  sourceId: String!
  origin: String!

  """When its descriptor was last read, as an ISO date."""
  verifiedOn: String!
  productTypes: [String!]!
}

"""
The registered archives and the last registration started on this server.
"""
type Archives {
  sources: [ArchiveSource!]!

  """
  state (running, finished or failed), started_at, finished_at and error; null if none was started.
  """
  registration: JSON
}

type Dataset {
  id: ID!
  kind: String!
  status: String!
  mediaType: String!
  byteCount: Int!
  parents: [String!]!
  document: JSON!
}

type Dossier {
  id: ID!
  experimentId: String!
  manifestId: String!
  verdict: String!
  findings: JSON!
  limitations: [String!]!
  sections: JSON!
  approvals: JSON!
}

type Event {
  sequence: Int!
  name: String!
  aggregateId: String!
  occurredAt: String!
  payload: JSON!
}

type Experiment {
  id: ID!
  state: String!
  protocol: String!
  protocolVersion: String!
  predeclarationHash: String!
  seed: Int!
  backend: String!
  parameters: JSON!
  inputs: JSON!
  tasks: [Task!]!
  verdict: Verdict
  checks: [GateCheck!]!
  failure: JSON
  refusal: String
  limitations: [String!]!
  manifestId: String
  bundleDoi: String
  startedAt: String
  finishedAt: String

  """The evidence manifest, as written to the NAS."""
  manifest: JSON
  dossiers: [Dossier!]!
}

"""One predeclared gate evaluated against a finding."""
type GateCheck {
  gateId: String!
  finding: String!
  value: JSON
  unit: String
  comparator: String!
  threshold: JSON!
  severity: String!
  oracleIds: [String!]!
  oraclesVerified: Boolean!
  outcome: String!
}

type Hypothesis {
  id: ID!
  version: Int!
  statement: String!
  evaluationCriteria: [String!]!
  supersedes: Int
}

"""One candidate from a field: EXPLORATORY, never a verdict (INV-008)."""
type Investigation {
  id: ID!
  setId: String!
  fieldId: String!
  candidateKey: String!
  candidate: JSON!
  state: String!
  label: String!
  score: Float!
  rankingPolicy: String!
  testResults: JSON!
  evidenceBundleIds: [String!]!
  evidenceUsed: JSON!
  transitions: [InvestigationTransition!]!
  notes: JSON!
  links: JSON!

  """The candidate's dossier, rebuilt from the set's stage artifacts."""
  dossier: JSON
}

"""
One run of Investigate over a field under a profile, with its multiplicity.
"""
type InvestigationSet {
  id: ID!
  fieldId: String!
  field: JSON!
  profileId: String!
  profileVersion: String!
  profileHash: String!
  profile: JSON!
  seed: Int!
  startedAt: String!
  complete: Boolean!
  stages: [InvestigationStage!]!
  objectsExamined: Int!
  testsApplied: JSON!
  archiveReleases: [String!]!
  nullResults: JSON!
  investigationIds: [String!]!
  manifestId: String
  label: String!

  """The approved AcquisitionPlan this run executed, when it was planned."""
  planArtifactId: String

  """The set's manifest, as written to the store."""
  manifest: JSON

  """The set's investigations, highest score first."""
  investigations(state: String = null): [Investigation!]!
}

"""One Investigate stage of a set (Investigate §1)."""
type InvestigationStage {
  stage: String!
  state: String!
  artifactId: String
  finishedAt: String
  error: String
  summary: JSON!
}

"""A state change of an investigation, with who made it and why."""
type InvestigationTransition {
  fromState: String
  toState: String!
  reason: String!
  actor: String!
  at: String!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type LedgerEntry {
  id: ID!
  sequence: Int!
  kind: String!
  subjectId: String!
  subjectHash: String!
  recordedAt: String!
  signer: String!
  signatureMethod: String!
  previousEntryHash: String
  payload: JSON!
}

"""
An AcquisitionPlan (ADR-020) with its state: drafted, auto_approved, approved, refused or executed.
"""
type Plan {
  id: ID!

  """The investigation set its execution opened."""
  setId: String
  state: String!

  """The plan document (acquisition-plan.schema.json)."""
  document: JSON!

  """plan_id, acquired artifact ids, unavailable items."""
  execution: JSON

  """
  The execution started in the background, while it runs and after: state (running, finished or failed), started_at, finished_at and error. Null when none was started since the server started.
  """
  run: JSON
}

type Query {
  experiments(state: String = null): [Experiment!]!
  experiment(id: ID!): Experiment
  hypotheses: [Hypothesis!]!
  hypothesisVersions(id: ID!): [Hypothesis!]!
  dossier(id: ID!): Dossier
  datasets: [Dataset!]!

  """Domain events after a sequence number, oldest first."""
  events(after: Int! = 0, limit: Int! = 100): [Event!]!

  """Ancestors of an entity in the provenance graph."""
  lineage(entityId: ID!): [String!]!
  ledger: [LedgerEntry!]!

  """Investigation sets, newest first (Investigate)."""
  investigationSets: [InvestigationSet!]!
  investigationSet(id: ID!): InvestigationSet
  investigation(id: ID!): Investigation

  """Acquisition plans (ADR-020)."""
  plans: [Plan!]!
  plan(id: ID!): Plan

  """
  The archives plans are matched against; null when the server cannot register them.
  """
  archives: Archives
}

type Task {
  taskId: String!
  taskKind: String!
  dependsOn: [String!]!
  status: String!
  checkpoint: String
  durationS: Float
}

type Verdict {
  status: String!
  protocolVersion: String!
  reasons: [String!]!
}
